<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminders — RoomMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="reminders" data-root="pages">

  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-area">
      <div id="header-mount"></div>
      <main class="page-content">
        <div class="page-heading">
          <div>
            <h2>Reminders</h2>
            <p>Upcoming bills and payments for the room</p>
          </div>
          <button class="btn btn--primary" id="add-reminder-btn"><i data-lucide="plus"></i><span>New
              Reminder</span></button>
        </div>

        <div class="card">
          <div class="card__body" id="reminders-list"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/reminders.js"></script>
</body>

</html>
