<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — RoomMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="reports" data-root="pages">

  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-area">
      <div id="header-mount"></div>
      <main class="page-content">
        <div class="page-heading">
          <div>
            <h2>Reports</h2>
            <p>A closer look at how the room spends money</p>
          </div>
          <select id="report-period">
            <option value="this-week">This Week</option>
            <option value="this-month" selected>This Month</option>
            <option value="last-month">Last Month</option>
            <option value="last-3-months">Last 3 Months</option>
            <option value="this-year">This Year</option>
          </select>
        </div>

        <div class="stat-mini-grid">
          <div class="stat-mini">
            <div class="stat-mini__label">Total Expenses</div>
            <div class="stat-mini__value" id="stat-total">$0.00</div>
          </div>
          <div class="stat-mini">
            <div class="stat-mini__label">Average Monthly</div>
            <div class="stat-mini__value" id="stat-avg">$0.00</div>
          </div>
          <div class="stat-mini">
            <div class="stat-mini__label">Highest Category</div>
            <div class="stat-mini__value" id="stat-highest-category">—</div>
          </div>
          <div class="stat-mini">
            <div class="stat-mini__label">Highest Spender</div>
            <div class="stat-mini__value" id="stat-highest-spender">—</div>
          </div>
          <div class="stat-mini">
            <div class="stat-mini__label">Total Settled</div>
            <div class="stat-mini__value text-green" id="stat-settled">$0.00</div>
          </div>
          <div class="stat-mini">
            <div class="stat-mini__label">Total Outstanding</div>
            <div class="stat-mini__value text-red" id="stat-outstanding">$0.00</div>
          </div>
        </div>

        <div class="card" style="margin-bottom:18px">
          <div class="card__header">
            <h3>Monthly Expenses</h3>
          </div>
          <div class="card__body"><canvas id="monthly-chart" height="90"></canvas></div>
        </div>

        <div class="dashboard-grid-2">
          <div class="card">
            <div class="card__header">
              <h3>Expenses by Category</h3>
            </div>
            <div class="card__body"><canvas id="category-chart" height="220"></canvas></div>
          </div>
          <div class="card">
            <div class="card__header">
              <h3>Member Spending</h3>
            </div>
            <div class="card__body"><canvas id="member-chart" height="220"></canvas></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/reports.js"></script>
</body>

</html>
