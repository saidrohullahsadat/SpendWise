<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomMate — Room Expense Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="dashboard">

  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <div class="main-area">
      <div id="header-mount"></div>

      <main class="page-content">
        <div class="summary-grid" id="summary-cards"></div>

        <div class="dashboard-grid">
          <div class="card">
            <div class="card__header">
              <h3>Expense Overview</h3>
              <select id="overview-month-filter">
                <option>This Month</option>
              </select>
            </div>
            <div class="card__body">
              <div class="chart-wrap">
                <canvas id="overview-chart" width="220" height="220"></canvas>
                <div class="chart-center">
                  <div class="chart-center__value" id="overview-total">$0.00</div>
                  <div class="chart-center__label">Total</div>
                </div>
              </div>
              <div class="legend" id="overview-legend"></div>
            </div>
          </div>

          <div class="card">
            <div class="card__header">
              <h3>Recent Expenses</h3>
              <a class="link-btn" href="pages/expenses.html">View All <i data-lucide="arrow-right"></i></a>
            </div>
            <div class="card__body" id="recent-expenses"></div>
          </div>
        </div>

        <div class="dashboard-grid-2">
          <div class="card">
            <div class="card__header">
              <h3>Member Balances</h3>
              <a class="link-btn" href="pages/members.html">View All <i data-lucide="arrow-right"></i></a>
            </div>
            <div class="card__body" id="member-balances"></div>
          </div>

          <div class="card">
            <div class="card__header">
              <h3>Upcoming Reminders</h3>
              <a class="link-btn" href="pages/reminders.html">View All <i data-lucide="arrow-right"></i></a>
            </div>
            <div class="card__body" id="upcoming-reminders"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
